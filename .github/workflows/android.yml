name: Compilar APK Android

on:
  push:
    paths:
      - 'Minimalista-Launcher-Projeto.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -q Minimalista-Launcher-Projeto.zip -d build-source

      - name: Compilar APK
        run: gradle -p build-source/minimalista-v2 assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Minimalista-Launcher-APK
          path: build-source/minimalista-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
